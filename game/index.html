<body>
  <main>
    <section id="home" class="screen">
      <nav id="book-tabs" class="book-tabs" aria-label="科別"></nav>
      <header class="masthead">
        <p class="kicker" id="kicker"></p>
        <h1 id="book-title"></h1>
        <p class="lede" id="lede"></p>
        <button class="btn ghost" id="open-cards"></button>
      </header>
      <ol id="chapter-list" class="chapter-list"></ol>
    </section>

    <section id="cards" class="screen" hidden>
      <button class="link" id="back-home-cards">&larr; 章節</button>
      <h2 class="page-head">教學卡收藏</h2>
      <div id="card-shelf"></div>
    </section>

    <section id="chapter" class="screen" hidden>
      <button class="link" id="back-home">&larr; 章節</button>
      <h2 id="chapter-heading"></h2>
      <ol id="case-list" class="case-list"></ol>
    </section>

    <section id="play" class="screen" hidden>
      <div class="play-top">
        <button class="link" id="back-chapter">&larr; 病例清單</button>
        <div>
          <h2 id="play-title"></h2>
          <p id="play-patient" class="patient-tag"></p>
        </div>
      </div>
      <div class="play-grid">
        <article id="story" class="story"></article>
        <aside class="clipboard">
          <h3>病歷摘要 <span id="clue-count" class="count">0</span></h3>
          <ul id="clue-list"></ul>
        </aside>
      </div>
    </section>
  </main>

  <dialog id="card-view" class="card-view" aria-label="教學卡">
    <div class="cv-bar">
      <button class="link" id="card-prev">&larr; 上一張</button>
      <span id="card-view-pos" class="cv-pos"></span>
      <button class="link" id="card-next">下一張 &rarr;</button>
      <button class="cv-close" id="card-close" aria-label="關閉">&times;</button>
    </div>
    <article class="tcard big" id="card-view-body"></article>
  </dialog>
